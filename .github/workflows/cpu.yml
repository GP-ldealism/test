name: CPU checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ci/requirements.txt
      - name: Prepare metric weights (network allowed here)
        run: python -c "import lpips; lpips.LPIPS(net='alex', verbose=False)"
      - name: Lint
        run: python -m ruff check app scripts tests analysis ci
      - name: Run tests offline on CPU
        run: python ci/run_cpu_tests.py --junitxml=cpu-tests.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-test-report
          path: cpu-tests.xml
          if-no-files-found: warn
